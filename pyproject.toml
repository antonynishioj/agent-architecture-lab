[project]
name = "agent-architecture-lab"
version = "0.2.0"
description = "Experimental framework for measuring the quality, cost, latency, and reliability of different AI agent architectures."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "google-genai==2.24.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests",
    "tzdata",
    "uvicorn[standard]",
]

[project.optional-dependencies]
blog = [
    "matplotlib",
    "python-docx",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
